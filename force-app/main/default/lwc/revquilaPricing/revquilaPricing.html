<template>
  <div
    class="rq-stage"
    onpointermove={handlePointerMove}
    onpointerleave={handlePointerLeave}
  >
    <div class="rq-fx" aria-hidden="true"></div>

    <div class="rq-main">
      <div class="rq-topbar rq-rise">
        <c-revquila-brand></c-revquila-brand>
      </div>

      <header class="rq-head rq-rise rq-d1">
        <div>
          <p class="rq-eyebrow">Pricing</p>
          <h1>
            Discounts that need no approval, <em>and prices everywhere</em>.
          </h1>
        </div>
        <div class="rq-actions-end">
          <button class="rq-btn rq-quiet" onclick={openSetup}>
            Policy and currencies in Setup
          </button>
          <template lwc:if={canManage}>
            <button class="rq-btn rq-primary" onclick={openNew}>
              + New price rule
            </button>
          </template>
        </div>
      </header>

      <section class="rq-stats">
        <template for:each={policy} for:item="stat">
          <div key={stat.label} class={stat.cardClass}>
            <span class="rq-stat-label">{stat.label}</span>
            <span class="rq-stat-value">{stat.value}</span>
            <span class="rq-stat-note">{stat.note}</span>
          </div>
        </template>
      </section>

      <div class="rq-two">
        <section class="rq-card rq-stretch rq-rise rq-d6">
          <div class="rq-card-head">
            <div>
              <h2>Volume price rules</h2>
              <p class="rq-sub">
                From a quantity, a line gets the discount on top of the rep's.
                It is not counted against the approval limit.
              </p>
            </div>
          </div>
          <template lwc:if={hasRules}>
            <div class="rq-tw">
              <table class="rq-stack">
                <thead>
                  <tr>
                    <th>Rule</th>
                    <th>Product</th>
                    <th class="rq-hide-md">From</th>
                    <th class="rq-right">Discount</th>
                    <th>State</th>
                    <template lwc:if={canManage}>
                      <th class="rq-act-col">
                        <span class="rq-sr">Change</span>
                      </th>
                    </template>
                  </tr>
                </thead>
                <tbody>
                  <template for:each={ruleRows} for:item="rule">
                    <tr key={rule.id}>
                      <td class="rq-cell-title">
                        <span class="rq-strong">{rule.name}</span>
                        <small>{rule.note}</small>
                      </td>
                      <td class="rq-cell-meta">{rule.product}</td>
                      <td class="rq-hide-md rq-cell-extra">{rule.from}</td>
                      <td class="rq-right rq-amount rq-cell-value">
                        {rule.discountLabel}
                      </td>
                      <td class="rq-cell-state">
                        <span class={rule.stateClass}>{rule.stateLabel}</span>
                      </td>
                      <template lwc:if={canManage}>
                        <td class="rq-act-col rq-cell-extra">
                          <button
                            class="rq-btn rq-quiet rq-sm"
                            data-id={rule.id}
                            onclick={openEdit}
                          >
                            Edit
                          </button>
                          <button
                            class="rq-btn rq-quiet rq-sm rq-to-bad"
                            data-id={rule.id}
                            onclick={openDelete}
                          >
                            Delete
                          </button>
                        </td>
                      </template>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </template>
          <template lwc:if={loading}>
            <div class="rq-loading" role="status">
              <span class="rq-spinner" aria-hidden="true"></span>
              Loading…
            </div>
          </template>
          <template lwc:if={loadError}>
            <p class="rq-verdict rq-tone-bad" role="alert">{loadError}</p>
          </template>
          <template lwc:if={noRules}>
            <div class="rq-empty">
              <h2>No price rules yet</h2>
              <p class="rq-sub">
                A rule such as "50 seats and up: 5% off" prices big deals by
                itself, with nothing to approve.
              </p>
            </div>
          </template>
        </section>

        <div class="rq-stack-cards">
          <section class="rq-card rq-lift rq-rise rq-d7">
            <h2>Try a quantity</h2>
            <p class="rq-sub">What the rules give, at the home list price</p>
            <div class="rq-form rq-try">
              <div class="rq-form-grid">
                <div class="rq-field">
                  <label for="tryProduct">Product</label>
                  <select
                    id="tryProduct"
                    class="rq-input"
                    onchange={handleTryProduct}
                  >
                    <template for:each={tryOptions} for:item="option">
                      <option
                        key={option.key}
                        value={option.key}
                        selected={option.selected}
                      >
                        {option.label}
                      </option>
                    </template>
                  </select>
                </div>
                <div class="rq-field">
                  <label for="tryQty">Quantity</label>
                  <input
                    id="tryQty"
                    class="rq-input"
                    type="number"
                    min="1"
                    step="1"
                    value={tryQty}
                    oninput={handleTryQty}
                  />
                </div>
              </div>
              <template lwc:if={tryResult}>
                <div class="rq-result">
                  <div class="rq-card-head">
                    <b>{tryResult.list}</b>
                    <span class={tryResult.verdictClass}
                      >{tryResult.discount}</span
                    >
                  </div>
                  <dl class="rq-kv">
                    <div class="rq-kv-row">
                      <dt>Customer pays, before tax</dt>
                      <dd>{tryResult.net}</dd>
                    </div>
                    <template lwc:if={tryResult.saving}>
                      <div class="rq-kv-row">
                        <dt>Volume discount</dt>
                        <dd>{tryResult.saving}</dd>
                      </div>
                    </template>
                  </dl>
                  <p class="rq-sub">{tryResult.rule}</p>
                </div>
              </template>
            </div>
          </section>

          <section class="rq-card rq-lift rq-rise rq-d8">
            <h2>Currencies</h2>
            <p class="rq-sub">
              Where you sell, and what {sampleName} costs there at today's rates
            </p>
            <ul class="rq-items">
              <template for:each={markets} for:item="market">
                <li key={market.key} class="rq-item">
                  <span>
                    <strong>{market.name}</strong>
                    <small>{market.tax} · {market.rate}</small>
                  </span>
                  <b class="rq-sample">{market.sample}</b>
                </li>
              </template>
            </ul>
          </section>
        </div>
      </div>
    </div>
  </div>

  <template lwc:if={modal}>
    <template lwc:if={isRuleForm}>
      <c-revquila-modal
        heading={modalHeading}
        size="small"
        onclose={closeModal}
        lwc:ref="modal"
      >
        <div class="rq-form">
          <div class={nameFieldClass}>
            <label for="name">Rule name</label>
            <input
              id="name"
              class="rq-input"
              type="text"
              autocomplete="off"
              placeholder="e.g. Platform: 50 seats and up"
              value={form.name}
              data-field="name"
              data-autofocus="true"
              oninput={handleField}
            />
            <template lwc:if={errors.name}>
              <span class="rq-error" role="alert">{errors.name}</span>
            </template>
          </div>
          <div class="rq-field">
            <label for="product">Applies to</label>
            <select
              id="product"
              class="rq-input"
              data-field="productKey"
              onchange={handleField}
            >
              <template for:each={productOptions} for:item="option">
                <option
                  key={option.key}
                  value={option.key}
                  selected={option.selected}
                >
                  {option.label}
                </option>
              </template>
            </select>
          </div>
          <div class="rq-form-grid">
            <div class={qtyFieldClass}>
              <label for="minQty">From quantity</label>
              <input
                id="minQty"
                class="rq-input"
                type="number"
                min="1"
                step="1"
                value={form.minQty}
                data-field="minQty"
                oninput={handleField}
              />
              <template lwc:if={errors.minQty}>
                <span class="rq-error" role="alert">{errors.minQty}</span>
              </template>
            </div>
            <div class={discountFieldClass}>
              <label for="discount">Discount %</label>
              <input
                id="discount"
                class="rq-input"
                type="number"
                min="0"
                max="100"
                step="any"
                value={form.discount}
                data-field="discount"
                oninput={handleField}
              />
              <template lwc:if={errors.discount}>
                <span class="rq-error" role="alert">{errors.discount}</span>
              </template>
            </div>
          </div>
          <div class="rq-field">
            <label for="note">Note</label>
            <input
              id="note"
              class="rq-input"
              type="text"
              autocomplete="off"
              value={form.note}
              data-field="note"
              oninput={handleField}
            />
          </div>
          <label class="rq-switch">
            <input
              type="checkbox"
              checked={form.active}
              data-field="active"
              onchange={handleField}
            />
            <span class="rq-track"></span>
            Active
          </label>
          <template lwc:if={saveError}>
            <span class="rq-error" role="alert">{saveError}</span>
          </template>
        </div>
        <div slot="footer" class="rq-actions-end">
          <button class="rq-btn rq-quiet" onclick={cancelModal}>Cancel</button>
          <button
            class="rq-btn rq-primary"
            disabled={busy}
            onclick={handleSave}
          >
            {saveLabel}
          </button>
        </div>
      </c-revquila-modal>
    </template>
    <template lwc:if={isDelete}>
      <c-revquila-modal
        heading="Delete this price rule?"
        subheading={deleting.name}
        size="small"
        onclose={closeModal}
        lwc:ref="modal"
      >
        <p class="rq-dialog-body">
          Quotes already priced keep the discount they got. New lines will not
          get it.
        </p>
        <div slot="footer" class="rq-actions-end">
          <button class="rq-btn rq-quiet" onclick={cancelModal}>Keep it</button>
          <button
            class="rq-btn rq-danger"
            data-autofocus="true"
            disabled={busy}
            onclick={confirmDelete}
          >
            Delete rule
          </button>
        </div>
      </c-revquila-modal>
    </template>
  </template>

  <c-revquila-toast lwc:ref="toast"></c-revquila-toast>
  <c-revquila-ai-chatbot></c-revquila-ai-chatbot>
</template>
