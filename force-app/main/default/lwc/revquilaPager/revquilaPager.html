<template>
  <template lwc:if={shown}>
    <nav class={barClass} aria-label={navLabel} onkeydown={handleKeydown}>
      <template lwc:if={full}>
        <span class="rq-pg-track" aria-hidden="true">
          <span style={progressStyle}></span>
        </span>
        <p class="rq-pg-range" aria-live="polite">
          Showing <b>{rangeLabel}</b> of <b>{totalLabel}</b>
        </p>
      </template>

      <div class="rq-pg-pages">
        <button
          class={previousClass}
          aria-label="Previous page"
          aria-disabled={previousDisabled}
          onclick={handlePrevious}
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15 6l-6 6 6 6"></path>
          </svg>
        </button>
        <template for:each={items} for:item="item">
          <span key={item.key} class="rq-pg-slot">
            <template lwc:if={item.gap}>
              <span class="rq-pg-gap" aria-hidden="true">…</span>
            </template>
            <template lwc:else>
              <button
                class={item.itemClass}
                aria-label={item.label}
                aria-current={item.current}
                data-page={item.page}
                onclick={handlePage}
              >
                {item.page}
              </button>
            </template>
          </span>
        </template>
        <span class="rq-pg-of">{pageLabel}</span>
        <button
          class={nextClass}
          aria-label="Next page"
          aria-disabled={nextDisabled}
          onclick={handleNext}
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 6l6 6-6 6"></path>
          </svg>
        </button>
      </div>

      <template lwc:if={showSizes}>
        <label class="rq-pg-size">
          Rows per page
          <select class="rq-input" onchange={handleSize}>
            <template for:each={sizeOptions} for:item="option">
              <option
                key={option.value}
                value={option.value}
                selected={option.selected}
              >
                {option.value}
              </option>
            </template>
          </select>
        </label>
      </template>
    </nav>
  </template>
</template>
