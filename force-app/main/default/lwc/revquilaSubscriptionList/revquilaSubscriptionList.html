<template>
  <div
    class="rq-stage"
    onpointermove={handlePointerMove}
    onpointerleave={handlePointerLeave}
  >
    <div class="rq-fx" aria-hidden="true"></div>

    <div class="rq-main">
      <div class="rq-topbar rq-rise">
        <c-revquila-brand></c-revquila-brand>
      </div>

      <header class="rq-head rq-rise rq-d1">
        <div>
          <p class="rq-eyebrow">Subscriptions</p>
          <h1>Recurring revenue, <em>contract by contract</em>.</h1>
        </div>
        <button class="rq-btn rq-primary" onclick={openRenewals}>
          Renewal pipeline
        </button>
      </header>

      <section class="rq-stats">
        <template for:each={stats} for:item="stat">
          <div key={stat.label} class={stat.cardClass}>
            <span class="rq-stat-label">{stat.label}</span>
            <span class="rq-stat-value">{stat.value}</span>
            <span class="rq-stat-note">{stat.note}</span>
          </div>
        </template>
      </section>

      <section class="rq-card rq-toolbar rq-rise rq-d6" lwc:ref="toolbar">
        <div class="rq-search">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="7"></circle>
            <path d="M16.5 16.5L21 21"></path>
          </svg>
          <input
            class="rq-input"
            type="search"
            placeholder="Search account, product, owner"
            aria-label="Search subscriptions"
            value={search}
            oninput={handleSearch}
          />
        </div>
        <div class="rq-chips" role="group" aria-label="Filter by status">
          <template for:each={chips} for:item="chip">
            <button
              key={chip.key}
              class={chip.chipClass}
              aria-pressed={chip.pressed}
              data-key={chip.key}
              onclick={handleFilter}
            >
              {chip.label} <b>{chip.count}</b>
            </button>
          </template>
        </div>
      </section>

      <section class="rq-card rq-stretch rq-rise rq-d7">
        <div class="rq-card-head">
          <h2>{summary}</h2>
          <p class="rq-sub">Soonest renewal first</p>
        </div>
        <template lwc:if={hasSubscriptions}>
          <div class="rq-tw">
            <table class="rq-stack">
              <thead>
                <tr>
                  <th>Subscription</th>
                  <th>Account</th>
                  <th class="rq-right">MRR</th>
                  <th class="rq-hide-md">Renewal</th>
                  <th class="rq-hide-md">Auto-renew</th>
                  <th>Status</th>
                  <th class="rq-chev-col"><span class="rq-sr">Open</span></th>
                </tr>
              </thead>
              <tbody>
                <template for:each={paging.rows} for:item="subscription">
                  <tr
                    key={subscription.id}
                    class="rq-go rq-rise"
                    style={subscription.rowStyle}
                    data-id={subscription.id}
                    onclick={openSubscription}
                  >
                    <td class="rq-cell-meta">
                      <button class="rq-link">{subscription.number}</button>
                      <small>{subscription.owner}</small>
                    </td>
                    <td class="rq-cell-title">
                      <span class="rq-strong">{subscription.account}</span>
                      <small>{subscription.productSummary}</small>
                    </td>
                    <td class="rq-right rq-amount rq-cell-value">
                      {subscription.mrrLabel}
                    </td>
                    <td class="rq-hide-md rq-cell-extra">
                      {subscription.renewalLabel}
                      <small>{subscription.renewalNote}</small>
                    </td>
                    <td class="rq-hide-md rq-cell-extra">
                      <span class={subscription.autoRenewClass}>
                        {subscription.autoRenewLabel}
                      </span>
                    </td>
                    <td class="rq-cell-state">
                      <span class={subscription.pillClass}>
                        {subscription.statusLabel}
                      </span>
                    </td>
                    <td class="rq-chev-col rq-cell-extra">
                      <svg
                        class="rq-chev"
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                      >
                        <path d="M9 6l6 6-6 6"></path>
                      </svg>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
          <c-revquila-pager
            total={paging.total}
            page={paging.page}
            page-size={pageSize}
            noun="subscription"
            onpagechange={handlePage}
            onsizechange={handlePageSize}
          ></c-revquila-pager>
        </template>
        <template lwc:if={loading}>
          <div class="rq-loading" role="status">
            <span class="rq-spinner" aria-hidden="true"></span>
            Loading…
          </div>
        </template>
        <template lwc:if={loadError}>
          <p class="rq-verdict rq-tone-bad" role="alert">{loadError}</p>
        </template>
        <template lwc:if={isEmpty}>
          <div class="rq-empty">
            <h2>No subscriptions yet</h2>
            <p class="rq-sub">
              A subscription starts when a quote with yearly products is signed.
            </p>
          </div>
        </template>
        <template lwc:if={noMatch}>
          <div class="rq-empty">
            <h2>No subscriptions match</h2>
            <p class="rq-sub">Try a different status, or clear the search.</p>
            <button class="rq-btn rq-quiet" onclick={clearFilters}>
              Show all subscriptions
            </button>
          </div>
        </template>
      </section>
    </div>
  </div>

  <c-revquila-ai-chatbot></c-revquila-ai-chatbot>
</template>
