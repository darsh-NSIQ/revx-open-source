<template>
  <div
    class="rq-stage"
    onpointermove={handlePointerMove}
    onpointerleave={handlePointerLeave}
  >
    <div class="rq-fx" aria-hidden="true"></div>

    <div class="rq-main">
      <div class="rq-topbar rq-rise">
        <c-revquila-brand></c-revquila-brand>
      </div>

      <header class="rq-head rq-rise rq-d1">
        <div>
          <p class="rq-eyebrow">Contracts</p>
          <h1>What is signed, <em>and for how long</em>.</h1>
        </div>
      </header>

      <section class="rq-stats">
        <template for:each={stats} for:item="stat">
          <div key={stat.label} class={stat.cardClass}>
            <span class="rq-stat-label">{stat.label}</span>
            <span class="rq-stat-value">{stat.value}</span>
            <span class="rq-stat-note">{stat.note}</span>
          </div>
        </template>
      </section>

      <section class="rq-card rq-toolbar rq-rise rq-d6" lwc:ref="toolbar">
        <div class="rq-search">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="7"></circle>
            <path d="M16.5 16.5L21 21"></path>
          </svg>
          <input
            class="rq-input"
            type="search"
            placeholder="Search account, contract or quote number"
            aria-label="Search contracts"
            value={search}
            oninput={handleSearch}
          />
        </div>
        <div class="rq-chips" role="group" aria-label="Filter by status">
          <template for:each={chips} for:item="chip">
            <button
              key={chip.key}
              class={chip.chipClass}
              aria-pressed={chip.pressed}
              data-key={chip.key}
              onclick={handleFilter}
            >
              {chip.label} <b>{chip.count}</b>
            </button>
          </template>
        </div>
      </section>

      <section class="rq-card rq-stretch rq-rise rq-d7">
        <div class="rq-card-head">
          <h2>{summary}</h2>
          <p class="rq-sub">Soonest end first</p>
        </div>
        <template lwc:if={hasContracts}>
          <div class="rq-tw">
            <table class="rq-stack">
              <thead>
                <tr>
                  <th>Contract</th>
                  <th>Account</th>
                  <th class="rq-right">Annual value</th>
                  <th class="rq-hide-md">Term</th>
                  <th class="rq-hide-md">Auto-renew</th>
                  <th>Status</th>
                  <th class="rq-chev-col"><span class="rq-sr">Open</span></th>
                </tr>
              </thead>
              <tbody>
                <template for:each={paging.rows} for:item="contract">
                  <tr
                    key={contract.id}
                    class="rq-go rq-rise"
                    style={contract.rowStyle}
                    data-id={contract.id}
                    onclick={openContract}
                  >
                    <td class="rq-cell-meta">
                      <button class="rq-link">{contract.number}</button>
                      <small>{contract.quoteNumber}</small>
                    </td>
                    <td class="rq-cell-title">
                      <span class="rq-strong">{contract.account}</span>
                      <small>{contract.reference}</small>
                    </td>
                    <td class="rq-right rq-amount rq-cell-value">
                      {contract.annualLabel}
                    </td>
                    <td class="rq-hide-md rq-cell-extra">
                      {contract.startLabel} to {contract.endLabel}
                      <small>{contract.endNote}</small>
                    </td>
                    <td class="rq-hide-md rq-cell-extra">
                      <span class={contract.autoRenewClass}>
                        {contract.autoRenewLabel}
                      </span>
                    </td>
                    <td class="rq-cell-state">
                      <span class={contract.pillClass}>
                        {contract.statusLabel}
                      </span>
                    </td>
                    <td class="rq-chev-col rq-cell-extra">
                      <svg
                        class="rq-chev"
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                      >
                        <path d="M9 6l6 6-6 6"></path>
                      </svg>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
          <c-revquila-pager
            total={paging.total}
            page={paging.page}
            page-size={pageSize}
            noun="contract"
            onpagechange={handlePage}
            onsizechange={handlePageSize}
          ></c-revquila-pager>
        </template>
        <template lwc:if={loading}>
          <div class="rq-loading" role="status">
            <span class="rq-spinner" aria-hidden="true"></span>
            Loading…
          </div>
        </template>
        <template lwc:if={loadError}>
          <p class="rq-verdict rq-tone-bad" role="alert">{loadError}</p>
        </template>
        <template lwc:if={isEmpty}>
          <div class="rq-empty">
            <h2>No contracts yet</h2>
            <p class="rq-sub">
              A contract starts when a quote with yearly products is signed.
            </p>
          </div>
        </template>
        <template lwc:if={noMatch}>
          <div class="rq-empty">
            <h2>No contracts match</h2>
            <p class="rq-sub">Try a different status, or clear the search.</p>
            <button class="rq-btn rq-quiet" onclick={clearFilters}>
              Show all contracts
            </button>
          </div>
        </template>
      </section>
    </div>
  </div>

  <c-revquila-ai-chatbot></c-revquila-ai-chatbot>
</template>
