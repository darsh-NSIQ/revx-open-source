<template>
  <div class="rq-action-modal">
    <div class="rq-modal-head">
      <div class="rq-icon-wrap">
        <svg viewBox="0 0 24 24" class="rq-icon" aria-hidden="true">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
          <polyline points="10 9 9 9 8 9"></polyline>
        </svg>
      </div>
      <h2>Generate RevX CPQ Quote</h2>
      <p>Instantly convert this Opportunity into an enterprise CPQ Quote with mapped products, terms, and approval workflows.</p>
    </div>

    <div class="rq-modal-body">
      <template lwc:if={loading}>
        <div class="rq-loading-state">
          <div class="rq-spinner"></div>
          <span>Building CPQ Quote...</span>
        </div>
      </template>
      <template lwc:else>
        <div class="rq-info-box">
          <p><strong>Ready to configure:</strong> Clicking below will create a Draft Quote linked to this Opportunity and redirect you to the RevX Quote 360 editor.</p>
        </div>
      </template>
    </div>

    <div class="rq-modal-foot">
      <button class="rq-btn rq-btn-secondary" onclick={handleCancel} disabled={loading}>
        Cancel
      </button>
      <button class="rq-btn rq-btn-primary" onclick={handleCreateQuote} disabled={loading}>
        Create &amp; Open Quote
      </button>
    </div>
  </div>
</template>
